name: Dashboard Sync

# COMPLETELY SEPARATE from scan.yml — this only reads state.json (never
# writes it) and talks to Firebase. It cannot affect signal scanning or
# Telegram alerts in any way.

on:
  schedule:
    # Offset from round minutes for the same reason as scan.yml — avoids
    # the global pile-up on :00/:05/:10 etc.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch: {}

concurrency:
  group: nowick-dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dashboard.txt
      - env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: python dashboard_sync.py
