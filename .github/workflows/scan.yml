name: Nowick FX Scan

on:
  schedule:
    # Every 15 minutes, 24/7. Offset to :01/:16/:31/:46 — the minimum
    # possible offset off the round :00/:15/:30/:45 marks where every other
    # repo's cron also piles up (GitHub's own docs warn scheduled workflows
    # can be delayed/dropped under that load). Kept to exactly 1 minute
    # since this strategy trades off 15m candle closes: every extra minute
    # of delay is a minute of price drift away from the signal's entry.
    # Signal detection logic is unaffected; only the trigger timing changed.
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: nowick-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "nowick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "state update [skip ci]"
          git push
