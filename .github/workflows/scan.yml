name: Nowick FX Scan

on:
  schedule:
    # Every 15 minutes, 24/7. Offset to :04/:19/:34/:49 (not the round
    # :00/:15/:30/:45 marks) — GitHub's own docs warn that scheduled
    # workflows can be delayed or dropped under high load, and load peaks
    # hardest exactly on the round minutes every other repo also schedules
    # on. Signal detection logic is unaffected; only the trigger timing changed.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: nowick-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "nowick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "state update [skip ci]"
          git push
