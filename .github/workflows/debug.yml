name: Debug Price Compare
on:
  workflow_dispatch: {}
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
        run: python debug_price_compare.py
